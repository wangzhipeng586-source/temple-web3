services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temple
      POSTGRES_PASSWORD: temple
      POSTGRES_DB: temple
    ports:
      - "5432:5432"
    volumes:
      - temple_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temple -d temple"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  temple_pg:
